name: cate-agent-state
version: 1.2.0
description: "Report root and delegated Hermes CLI lifecycle to Cate for passive local status panels."
author: "TheXRMonk"
provides_hooks:
  - on_session_start
  - on_session_reset
  - pre_llm_call
  - on_session_end
  - on_session_finalize
  - subagent_start
  - subagent_stop
  - pre_tool_call
